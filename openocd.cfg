# OpenOCD 烧录/调试配置 — 正点原子探索者 STM32F407ZGT6
#
# 常用命令：
#   烧录:  openocd -f openocd.cfg -c "program build/STM32F407_M4.elf verify reset exit"
#   擦除:  openocd -f openocd.cfg -c "init; reset halt; stm32f4x mass_erase 0; shutdown"
#   调试:  openocd -f openocd.cfg   （起 GDB server :3333，配合 arm-none-eabi-gdb）

# ---- 调试器选择 ----
# 默认 ST-Link（正点原子标配 ST-LINK/V2 或 ATK-STLINK）。
# 如果用的是 DAP-Link / ATK-DAP 下载器，注释掉 stlink 行、放开 cmsis-dap 行：
source [find interface/stlink.cfg]
# source [find interface/cmsis-dap.cfg]

transport select hla_swd
adapter speed 2000

# ---- 目标芯片 ----
source [find target/stm32f4x.cfg]

# SWO 打印（可选，配合 ITM 调试输出）
# reset_config srst_only srst_nogate connect_assert_srst
